[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "s2g-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []
description = "Evidence-bound spec to GDS research orchestration"

[project.scripts]
s2g = "s2g.__main__:main"

[tool.setuptools.packages.find]
include = ["s2g*"]

[tool.setuptools.package-data]
s2g = ["assets/*.tcl", "assets/*.py"]
